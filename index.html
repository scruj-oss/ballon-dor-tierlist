        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { text-align: center; color: #f39c12; }
        .desc { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 14px; }
        .box { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; display: flex; min-height: 100px; }
        .label { width: 130px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #fff; text-align: center; }
        .zone { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; align-content: flex-start; }
        .card { background: #2f3542; border: 1px solid #485460; border-radius: 6px; width: 90px; padding: 6px; text-align: center; cursor: pointer; user-select: none; }
        .card:hover { background: #57606f; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #111; margin: 0 auto 4px auto; display: block; border: 1px solid #f39c12; }
        .name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .pool { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        .pool-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 120px; }
        /* Модалка */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 8px; width: 350px; border: 1px solid #444; color: #fff; position: relative; }
        .close { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #aaa; font-size: 18px; }

</head>

    <div class="box">

        <div class="zone" id="t-good" ondragover="allow(event)" ondrop="drop(event)"></div>
    </div>
    <div class="box">

        <div class="zone" id="t-norm" ondragover="allow(event)" ondrop="drop(event)"></div>

    <div class="box">
        <div class="label" style="background: #747d8c;">Бездарь</div>
        <div class="zone" id="t-bad" ondragover="allow(event)" ondrop="drop(event)"></div>

        ];

        const pool = document.getElementById("p-pool");

        function init() {
            pool.innerHTML = "";
            players.forEach(p => {
                const el = document.createElement("div");
                el.className = "card";
                el.draggable = true;
                el.id = p.id;
                el.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                el.onclick = () => openModal(p);
                el.innerHTML = `<img src="${p.img}" class="avatar" alt=""><div class="name">${p.name}</div>`;
                pool.appendChild(el);
            });
        }

        function allow(e) { e.preventDefault(); }

        function drop(e, limit = 0) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const card = document.getElementById(id);
            let target = e.target.closest(".zone");
            if (limit === 1 && target.children.length > 0) {
                alert("В GOAT можно поставить только 1 игрока!");
                return;
            }
            if (target) target.appendChild(card);
        }

        function dropPool(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            pool.appendChild(document.getElementById(id));
        }

        function openModal(p) {
            document.getElementById("m-title").innerText = `${p.name} (${p.club})`;
            document.getElementById("m-text").innerHTML = `<b>Статистика сезона 2025/26:</b><br><br>${p.stats}`;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        init();
    </script>
